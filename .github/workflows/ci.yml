name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 数据库冒烟
        run: |
          export CAT_DB=./data/ci-smoke.db
          mkdir -p data
          npm run db:reset
          node scripts/ci-assert.cjs

      - name: 构建
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: 冒烟测试 /api/health
        run: |
          set -e
          node .next/standalone/server.js & echo $! > /tmp/srv.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          node -e 'const h=require("/tmp/health.json"); if(!h.ok) process.exit(1);'
          kill "$(cat /tmp/srv.pid)"
